[project]
name = "career-codesk-prototype"
version = "0.2.0"
description = "Synthetic-only local foundation for the Career CoDesk prototype"
requires-python = ">=3.9,<3.10"
dependencies = [
    "Django==4.2.16",
    "asgiref==3.8.1",
    "sqlparse==0.5.1",
    "typing-extensions==4.16.0",
    "tzdata==2024.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["ruff==0.8.6"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", "static-build", "*.sqlite3"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
